<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Recipe App</h1>

    <input type="text" id="searchInput" placeholder="Search by title...">
    <button id="searchButton">Search</button>

    
    <button id="sortAsc">Sort by Ingredients (Low to High)</button>
    <button id="sortDesc">Sort by Ingredients (High to Low)</button>

    
    <div id="recipes"></div>

    
    <form id="recipeForm">

        <h2>Add a New Recipe</h2>
        <input type="text" id="title" placeholder="Recipe Name" required>
        <input type="text" id="picture_url" placeholder="Image URL" required>
        <textarea id="description" placeholder="Description" required></textarea>
        
        <h3>Ingredients</h3>
        <div id="ingredients">
            <input type="text" class="ingredient-name" placeholder="Ingredient Name" required>
            <input type="text" class="ingredient-amount" placeholder="Amount" required>
    
            <input type="text" class="ingredient-name" placeholder="Ingredient Name" required>
            <input type="text" class="ingredient-amount" placeholder="Amount" required>
    
            <input type="text" class="ingredient-name" placeholder="Ingredient Name" required>
            <input type="text" class="ingredient-amount" placeholder="Amount" required>
    
            <input type="text" class="ingredient-name" placeholder="Ingredient Name" required>
            <input type="text" class="ingredient-amount" placeholder="Amount" required>
    
            <input type="text" class="ingredient-name" placeholder="Ingredient Name" required>
            <input type="text" class="ingredient-amount" placeholder="Amount" required>
        </div>
        <button type="button" id="addIngredient">Add More Ingredients</button>
        <button type="submit">Add Recipe</button>
    </form>

    <h2>Cooking Timer</h2>
    <input type="number" id="cookingTime" placeholder="Enter minutes">
    <button id="startTimer">Start Timer</button>
    <p id="timerDisplay"></p>

    <h2>Time Spent on Page</h2>
    <p id="timeSpent">You have spent 0 seconds on this page.</p>
    
    <script src="script.js"></script>
</body>
</html>
